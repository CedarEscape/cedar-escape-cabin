<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | Cedar Rewards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/rewards.css?v=2">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
<header>
  <nav class="nav">
    <a href="index.html" class="wordmark">CEDAR <span>ESCAPE</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="rewards.html" class="current">Cedar Rewards</a></li>
      <li class="nav-check"><a href="check-availability.html" class="btn btn-gold">Reserve</a></li>
    </ul>
    <button class="burger">MENU</button>
  </nav>
</header>

<div class="wrap rw-section" style="max-width:420px;">
  <div class="eyebrow">Cedar Rewards</div>
  <h1 style="font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(26px,3.6vw,34px);color:var(--forest-deep);margin:10px 0 24px;">Sign in</h1>

  <div id="rwMsg" class="rw-msg success" style="display:none;"></div>

  <form id="rwSigninForm">
    <div class="rw-form-field">
      <label for="rwEmail">Email <span style="color:var(--gold);">*</span></label>
      <input type="email" id="rwEmail" required autocomplete="email">
    </div>
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAFDsIKTexHzWRAFv" style="margin-bottom:18px;"></div>
    <button type="submit" class="btn btn-gold" style="width:100%;">Send me a sign-in link</button>
  </form>

  <p style="margin-top:18px;font-size:13px;text-align:center;">Not a member yet? <a href="rewards.html" style="color:var(--gold);">Join Cedar Rewards</a></p>
</div>

<footer><div class="wrap"><div class="foot-bottom"><span>© 2026 Cedar Escape · Massanutten Resort, VA</span></div></div></footer>
<script src="js/rewards-common.js"></script>
<script>
  document.getElementById('rwSigninForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var msg = document.getElementById('rwMsg');
    var turnstileToken = (document.querySelector('[name="cf-turnstile-response"]') || {}).value;
    var btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;

    try {
      var res = await fetch('/api/rewards/signin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('rwEmail').value, turnstileToken: turnstileToken })
      });
      var data = await res.json();
      msg.textContent = data.message || (res.ok ? 'Check your email for a sign-in link.' : (data.error || 'Something went wrong.'));
      msg.className = res.ok ? 'rw-msg success' : 'rw-msg error';
      msg.style.display = '';
      if (!res.ok) btn.disabled = false;
    } catch (err) {
      msg.textContent = 'Something went wrong — please try again.';
      msg.className = 'rw-msg error';
      msg.style.display = '';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
