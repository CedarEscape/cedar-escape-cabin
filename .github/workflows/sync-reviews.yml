name: Sync guest reviews

on:
  schedule:
    - cron: "0 13 * * *" # daily at 9am US Eastern (13:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run review sync
        run: python3 scripts/sync_reviews.py

      - name: Commit and push if changed
        run: |
          git config user.name "cedar-escape-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Auto-sync guest reviews from direct booking site"
            git push
          else
            echo "No review changes to commit."
          fi
