<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity History | Cedar Rewards</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/rewards.css?v=3">
</head>
<body>
<header>
  <nav class="nav">
    <a href="index.html" class="wordmark">CEDAR <span>ESCAPE</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="rewards-dashboard.html" class="current">Cedar Rewards</a></li>
      <li class="nav-check"><a href="check-availability.html" class="btn btn-gold">Reserve</a></li>
    </ul>
    <button class="burger">MENU</button>
  </nav>
</header>

<div class="wrap rw-section" style="max-width:720px;">
  <div class="eyebrow">Cedar Rewards</div>
  <h1 style="font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(26px,3.6vw,34px);color:var(--forest-deep);margin:10px 0 30px;">Activity history</h1>
  <div id="rwActivity" class="rw-card rw-activity-list">Loading…</div>
  <p style="margin-top:24px;font-size:13px;"><a href="rewards-dashboard.html" style="color:var(--taupe);">← Back to dashboard</a></p>
</div>

<footer><div class="wrap"><div class="foot-bottom"><span>© 2026 Cedar Escape · Massanutten Resort, VA</span></div></div></footer>

<script src="js/rewards-common.js"></script>
<script>
  var icons = {
    gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M3 8h18M12 8v13M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>',
    house: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8-6.1-3.4-6.1 3.4 1.4-6.8-5.1-4.7 6.9-.8z"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
    pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>'
  };
  function entryLabel(row) {
    var labels = {
      earn: row.source === 'join' ? 'Welcome to Cedar Rewards' : row.source === 'direct_stay' ? 'Direct stay' : row.source === 'ig_follow' ? 'Followed Instagram' : row.source === 'fb_follow' ? 'Followed Facebook' : row.source === 'tagged_post' ? 'Tagged post approved' : 'Points earned',
      hold: 'Points held', spend: 'Reward redeemed', release: 'Hold released', reversal: 'Points reversed', adjustment: 'Adjustment'
    };
    return labels[row.entry_type] || row.entry_type;
  }
  function entrySign(row) {
    if (row.entry_type === 'earn' || row.entry_type === 'release') return 1;
    if (row.entry_type === 'adjustment') return row.points >= 0 ? 1 : -1;
    if (row.entry_type === 'hold') return row.hold_status === 'open' ? -1 : 0;
    return -1;
  }
  function entryIcon(row) {
    if (row.entry_type === 'earn' && row.source === 'join') return icons.gift;
    if (row.entry_type === 'earn' && row.source === 'direct_stay') return icons.house;
    if (row.entry_type === 'earn') return icons.star;
    if (row.entry_type === 'hold') return icons.clock;
    if (row.entry_type === 'release') return icons.check;
    if (row.entry_type === 'adjustment') return icons.pencil;
    return icons.gift;
  }
  function formatDate(iso) {
    try {
      var d = new Date(iso.replace(' ', 'T') + (iso.indexOf('Z') === -1 && iso.indexOf('T') === -1 ? 'Z' : ''));
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    } catch (e) { return ''; }
  }

  (async function init() {
    var me = await rwRequireSession();
    if (!me) return;
    var historyRes = await fetch('/api/rewards/history');
    var history = await historyRes.json();
    var activity = history.ledger || [];
    document.getElementById('rwActivity').innerHTML = activity.length ? activity.map(function (row) {
      var sign = entrySign(row);
      var cls = sign > 0 ? 'positive' : (sign < 0 ? 'negative' : '');
      var amount = sign === 0 ? '—' : (sign > 0 ? '+' : '-') + rwFormatPoints(row.points);
      return '<div class="rw-activity-row"><div class="act-icon">' + entryIcon(row) + '</div>' +
        '<div class="act-body"><div class="act-title">' + rwEscapeHtml(entryLabel(row)) + '</div><div class="act-date">' + formatDate(row.created_at) + '</div></div>' +
        '<span class="points ' + cls + '">' + amount + '</span></div>';
    }).join('') : 'Nothing yet.';
  })();
</script>
</body>
</html>
