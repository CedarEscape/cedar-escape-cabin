<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Cedar Rewards | Cedar Escape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/rewards.css?v=4">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

<header>
  <nav class="nav">
    <a href="index.html" class="wordmark">CEDAR <span>ESCAPE</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="add-ons.html">Add-Ons</a></li>
      <li><a href="rewards.html" class="current">Cedar Rewards</a></li>
      <li class="nav-check"><a href="check-availability.html" class="btn btn-gold">Reserve</a></li>
    </ul>
    <button class="burger">MENU</button>
  </nav>
</header>

<div class="wrap rw-section" style="max-width:480px;">
  <div class="eyebrow">Cedar Rewards</div>
  <h1 style="font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(26px,3.6vw,34px);color:var(--forest-deep);margin:10px 0 24px;">Join Cedar Rewards</h1>

  <div id="rwMsg" class="rw-msg error" style="display:none;"></div>

  <form id="rwJoinForm">
    <div class="rw-form-field">
      <label for="rwName">Name</label>
      <input type="text" id="rwName" autocomplete="name">
    </div>
    <div class="rw-form-field">
      <label for="rwEmail">Email <span style="color:var(--gold);">*</span></label>
      <input type="email" id="rwEmail" required autocomplete="email">
    </div>
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAFDsIKTexHzWRAFv" style="margin-bottom:18px;"></div>
    <button type="submit" class="btn btn-gold" style="width:100%;">Join Cedar Rewards</button>
  </form>

  <p style="margin-top:18px;font-size:13px;text-align:center;">Already a member? <a href="rewards-signin.html" style="color:var(--gold);">Sign in</a></p>
</div>

<footer>
  <div class="wrap">
    <div class="foot-bottom"><span>© 2026 Cedar Escape · Massanutten Resort, VA</span></div>
  </div>
</footer>

<script src="js/rewards-common.js"></script>
<script>
  document.getElementById('rwJoinForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var msg = document.getElementById('rwMsg');
    msg.style.display = 'none';

    var turnstileToken = (document.querySelector('[name="cf-turnstile-response"]') || {}).value;
    var btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;

    try {
      var res = await fetch('/api/rewards/join', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('rwEmail').value, name: document.getElementById('rwName').value, turnstileToken: turnstileToken })
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong.');
      window.location.href = 'rewards-check-your-email.html';
    } catch (err) {
      msg.textContent = err.message;
      msg.style.display = '';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
