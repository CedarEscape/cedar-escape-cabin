<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Your Stay | Cedar Rewards</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/rewards.css?v=2">
</head>
<body>
<header>
  <nav class="nav">
    <a href="index.html" class="wordmark">CEDAR <span>ESCAPE</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="rewards-dashboard.html" class="current">Cedar Rewards</a></li>
      <li class="nav-check"><a href="check-availability.html" class="btn btn-gold">Reserve</a></li>
    </ul>
    <button class="burger">MENU</button>
  </nav>
</header>

<div class="wrap rw-section" style="max-width:560px;">
  <div class="eyebrow">Cedar Rewards</div>
  <h1 style="font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(26px,3.6vw,34px);color:var(--forest-deep);margin:10px 0 24px;">Choose your stay</h1>

  <div id="rwMsg" class="rw-msg error" style="display:none;"></div>
  <div id="rwStays">Loading…</div>
</div>

<footer><div class="wrap"><div class="foot-bottom"><span>© 2026 Cedar Escape · Massanutten Resort, VA</span></div></div></footer>

<script src="js/rewards-common.js"></script>
<script>
  var params = new URLSearchParams(window.location.search);
  var rewardCode = params.get('reward');

  function showMsg(text) {
    var el = document.getElementById('rwMsg');
    el.textContent = text;
    el.style.display = '';
  }

  async function confirmStay(reservationId, btn) {
    btn.disabled = true;
    try {
      var res = await fetch('/api/rewards/redeem/request', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rewardCode: rewardCode, reservationId: reservationId })
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not submit this request.');
      sessionStorage.setItem('rwRedeemResult', JSON.stringify({ type: 'request' }));
      window.location.href = 'rewards-redeem.html';
    } catch (err) {
      showMsg(err.message);
      btn.disabled = false;
    }
  }

  (async function init() {
    var me = await rwRequireSession();
    if (!me) return;
    if (!rewardCode) { window.location.href = 'rewards-shop.html'; return; }

    var res = await fetch('/api/rewards/upcoming-stays');
    var data = await res.json();
    var stays = data.stays || [];

    var container = document.getElementById('rwStays');
    if (!stays.length) {
      container.innerHTML = '<div class="rw-card">' +
        '<p>You’ll need an upcoming direct stay to use this reward.</p>' +
        '<a href="check-availability.html" class="btn btn-gold" style="margin-top:14px;display:inline-flex;">Book Direct →</a>' +
        '</div>';
      return;
    }

    container.innerHTML = stays.map(function (s, i) {
      return '<div class="rw-card" style="margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;">' +
        '<span>' + rwEscapeHtml(s.checkIn) + ' → ' + rwEscapeHtml(s.checkOut) + ' (' + s.nights + ' nights)</span>' +
        '<button type="button" class="btn btn-gold rw-choose-btn" data-idx="' + i + '">Use this stay</button>' +
        '</div>';
    }).join('');

    container.querySelectorAll('.rw-choose-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { confirmStay(stays[+btn.dataset.idx].id, btn); });
    });
  })();
</script>
</body>
</html>
